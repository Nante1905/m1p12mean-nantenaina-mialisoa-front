<div
  class="error-content"
  [style.visibility]="
    control && control.errors && control.dirty && control.touched
      ? 'visible'
      : 'hidden'
  "
>
  @for (controlError of control.errors | keyvalue; track controlError.key) {
  <span class="text-wrapper text-red-500">
    <small>
      {{ getErrorMessage(controlError) }}
    </small>
  </span>
  }
</div>

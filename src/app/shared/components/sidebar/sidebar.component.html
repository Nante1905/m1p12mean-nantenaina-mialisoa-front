<aside class="sidebar" [class.collapsed]="!collapsed">
  <div class="sidebar-header">
    <div class="logo-container">
      <h2>Garaz'nay</h2>
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()" title="Toggle sidebar">
      <span class="material-icons">{{
        collapsed ? "chevron_right" : "chevron_left"
      }}</span>
    </button>
  </div>

  <div class="sidebar-content">
    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item">
          @for(item of navItems; track $index) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-link"
            [title]="collapsed ? item.label : ''"
            (click)="onclick($event)"
          >
            <span class="material-icons nav-icon">{{ item.icon }}</span>
            <span *ngIf="!collapsed" class="nav-text">{{ item.label }}</span>
          </a>
          }
        </li>
      </ul>
    </nav>
  </div>

  <div class="sidebar-footer">
    <div class="user-info" *ngIf="!collapsed" title="Profile">
      <p-button class="user-avatar-small" (onClick)="logOut()">
        <span class="material-icons">logout</span>
      </p-button>
      <div class="user-details">
        <span class="user-name"
          >{{ utililsateur.nom }} {{ utililsateur.prenom }}</span
        >
        <span class="user-role">{{ utililsateur.role }}</span>
      </div>
    </div>
    <div class="user-icon" *ngIf="collapsed">
      <p-button class="user-avatar-small" (onClick)="logOut()">
        <span class="material-icons">logout</span>
      </p-button>
    </div>
  </div>
</aside>

<div>
  <h1 class="text-center mt-4 mb-8">{{ title() }}</h1>
  <form
    [formGroup]="inscriptionForm"
    (ngSubmit)="handleSubmit()"
    class="flex flex-col gap-y-2"
  >
    <div>
      <input
        formControlName="nom"
        type="text"
        pInputText
        class="w-full"
        placeholder="Nom"
      />
      <app-validation-error
        [control]="inscriptionForm.controls['nom']"
      ></app-validation-error>
    </div>
    <div>
      <input
        formControlName="prenom"
        type="text"
        pInputText
        class="w-full"
        placeholder="Prénom"
      />
      <app-validation-error
        [control]="inscriptionForm.controls['prenom']"
      ></app-validation-error>
    </div>
    <div>
      <input
        formControlName="email"
        type="email"
        pInputText
        class="w-full"
        placeholder="Adresse email"
      />
      <app-validation-error
        [control]="inscriptionForm.controls['email']"
      ></app-validation-error>
    </div>
    <div>
      <input
        formControlName="telephone"
        type="tel"
        pInputText
        class="w-full"
        placeholder="Téléphone"
      />
      <app-validation-error
        [control]="inscriptionForm.controls['telephone']"
      ></app-validation-error>
    </div>
    <div>
      <p-password
        id="password"
        formControlName="pwd"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Mot de passe"
        styleClass="w-full"
        [style]="{ width: '100%' }"
        inputStyleClass="w-full"
      >
      </p-password>
      <app-validation-error
        [control]="inscriptionForm.controls['pwd']"
      ></app-validation-error>
      @if(addGenerateRandomPwd()) {
      <div class="flex justify-end">
        <p-button
          size="small"
          variant="text"
          severity="secondary"
          (onClick)="generatePwd()"
          >Générer mot de passe</p-button
        >
      </div>
      }
    </div>
    @if(addConfirmPwd()) {
    <div>
      <p-password
        id="password"
        formControlName="confirmPwd"
        [toggleMask]="true"
        [feedback]="false"
        placeholder="Confirmer le mot de passe"
        styleClass="w-full"
        [style]="{ width: '100%' }"
        inputStyleClass="w-full"
      >
      </p-password>
      @if(inscriptionForm.controls['confirmPwd'].hasError('passwordsMismatch')
      && addConfirmPwd()) {

      <span class="text-wrapper text-red-500">
        <small> Ne correspond pas au mot de passe. </small>
      </span>
      }
    </div>
    }

    <div class="action-buttons mx-auto">
      <p-button type="submit" [label]="submitBtnText()" [loading]="loading()">
      </p-button>
      @if(connexionUrl()) {
      <p-divider>OU</p-divider>
      <p class="text-center">
        <a [href]="connexionUrl()" class="text-accent hover:underline"
          >Se connecter</a
        >
      </p>

      }
    </div>
  </form>
</div>

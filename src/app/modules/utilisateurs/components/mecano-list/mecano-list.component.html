<div class="flex justify-end">
  <form class="flex items-center gap-2" (submit)="handleFilterSubmit()">
    <input
      pInputText
      type="text"
      placeholder="Nom prénom"
      size="small"
      [(ngModel)]="filter.nom"
      name="nom"
    />
    <p-button variant="outlined" severity="help" type="submit" size="small">
      <span class="material-icons">search</span>
    </p-button>
  </form>
</div>
<div class="mt-8">
  <p-table
    [loading]="loadingData"
    [value]="mecaniciens().items"
    selectionMode="single"
    (onRowSelect)="selectRow($event)"
  >
    <ng-template #header>
      <tr>
        <th>Nom et prénom</th>
        <th>Email</th>
        <th>Téléphone</th>
        <th>Date d'arrivée</th>
      </tr>
    </ng-template>
    <ng-template #body let-mecano>
      <tr class="!hover:bg-primary" [pSelectableRow]="mecano">
        <td>{{ getFullName(mecano) }}</td>
        <td>{{ mecano.email }}</td>
        <td>{{ mecano.telephone }}</td>
        <td>{{ renderDateArrivee(mecano.inscriptionDate) }}</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="flex justify-center">
    <p-paginator
      rows="10"
      (onPageChange)="onPageChange($event)"
      [totalRecords]="mecaniciens().totalItems || 1"
      [showPageLinks]="false"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Lignes {first} à {last} de {totalRecords}"
    />
  </div>
</div>

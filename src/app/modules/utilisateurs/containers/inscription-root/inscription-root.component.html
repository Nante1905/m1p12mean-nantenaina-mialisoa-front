<section
  class="relative h-full flex justify-center md:justify-end items-center inscription-section"
>
  <div class="absolute w-full h-full -z-10 background"></div>
  <div class="form-container">
    <img src="/logo.webp" alt="logo" width="80px" />

    <app-inscription-form
      [addConfirmPwd]="true"
      title="Créez votre compte"
      (onSubmit)="handleInscription($event)"
      [loading]="loading"
      connexionUrl="/login"
    />
  </div>
  <p-toast></p-toast>
</section>

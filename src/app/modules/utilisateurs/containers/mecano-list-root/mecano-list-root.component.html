<section>
  <header class="rdv-root__header mb-8 bg-[#fff] p-4 rounded-2xl shadow-md">
    <h1 class="text-2xl">Les mécaniciens</h1>
  </header>
  <section class="bg-[#fff] p-8 rounded-xl shadow-md">
    <app-mecano-list
      [mecaniciens]="(mecanoData$ | async) || defaultMecanoData"
      [loading]="loading"
      (onSubmitFilter)="onSubmitFilter($event)"
      (onSelectMecano)="onSelectMecano($event)"
    ></app-mecano-list>
  </section>
  <p-drawer
    [(visible)]="showDetailsMecano"
    position="right"
    styleClass="!w-[90%] md:!w-[70%] lg:!w-[30rem]"
  >
    <app-mecano-details [mecano]="selectedMecano"></app-mecano-details>
  </p-drawer>
</section>

<section class="create-devis-root">
  <header class="mb-8 bg-[#fff] p-4 rounded-2xl">
    <h1>Creer un devis</h1>
  </header>
  <div>
    <app-creation-devis-form
      [marques]="(marques$ | async) || []"
      [motorisations]="(motorisations$ | async) || []"
      [services]="(services$ | async) || []"
      [loading]="loading"
      (onSubmit)="handleSubmit($event)"
      [demandeDevis]="demandeDevis$"
    ></app-creation-devis-form>
  </div>
  <div></div>
</section>
<p-toast></p-toast>

<h1>Vos devis</h1>

    [children]="estimationButtonText"
    [link]="'/demande-devis'"
  />
</div>

<p-tabs>
  <p-tablist>
    <p-tab value="0">Demade de devis</p-tab>
    <p-tab value="1">Devis</p-tab>

      <p>demande de devis</p>
    </p-tabpanel>
    <p-tabpanel value="1">

</p-tabs>
